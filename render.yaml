services:
  - type: web
    name: agendaja-back
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://abatt-hash.github.io/agendaja-front/
      - key: JWT_EXPIRATION
        value: "3600"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: GMAIL_APPS_SCRIPT_URL
        sync: false
      - key: GMAIL_APPS_SCRIPT_SECRET
        sync: false
